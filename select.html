<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHARACTER SELECT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cy:#3ff0ff; --cy2:#1aa8ff; --mg:#ff3fa4; --yl:#ffe14a; --ice:#bff6ff;
    --bg:rgba(6,12,28,.66); --line:rgba(63,240,255,.45);
    --en:"Rajdhani",sans-serif; --jp:"Zen Kaku Gothic New",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060e;color:#e8fbff;font-family:var(--jp);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
  .panel{position:relative;background:var(--bg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:inset 0 0 0 1px var(--line)}
  .en{font-family:var(--en);letter-spacing:.14em}
  .tap{transition:transform .12s, filter .12s}
  .tap:hover{filter:brightness(1.25)}
  .tap:active{transform:scale(.95)}

  #fx{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 45% 45%,transparent 50%,rgba(0,0,10,.6) 100%)}

  /* ---------- UI ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;transition:opacity .35s}
  #ui button,#ui .panel{pointer-events:auto}
  body.skill #ui{opacity:0}
  body.skill #ui *{pointer-events:none !important}

  #head{position:fixed;left:24px;top:20px;display:flex;align-items:center;gap:16px}
  #back{height:40px;padding:0 18px 0 14px;font-family:var(--en);font-weight:700;letter-spacing:.16em;font-size:14px;display:flex;align-items:center;gap:8px}
  #title b{display:block;font-size:24px;font-weight:900;letter-spacing:.12em}
  #title small{font-family:var(--en);font-size:12px;letter-spacing:.4em;color:var(--cy)}

  /* 右パネル */
  #info{position:fixed;right:30px;top:84px;width:380px;transform:perspective(1100px) rotateY(-14deg);transform-origin:right center;display:flex;flex-direction:column;gap:10px;transition:opacity .4s, transform .5s}
  #info.hidden{opacity:0;transform:perspective(1100px) rotateY(-14deg) translateX(40px)}
  .card{padding:16px 20px}
  .rar{display:flex;gap:8px;align-items:center}
  .rar b{font-family:var(--en);font-size:12px;letter-spacing:.2em;padding:1px 10px;background:linear-gradient(90deg,var(--yl),#ffb84a);color:#201400;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
  .rar span{color:var(--yl);letter-spacing:2px;font-size:13px;text-shadow:0 0 8px rgba(255,225,74,.6)}
  .el{margin-left:auto;font-size:12px;display:flex;gap:6px;align-items:center;color:var(--ice)}
  .el i{width:22px;height:22px;display:grid;place-items:center;font-style:normal;background:rgba(191,246,255,.18);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
  #info h1{font-size:40px;font-weight:900;letter-spacing:.08em;margin-top:8px;line-height:1.1;text-shadow:0 0 18px rgba(63,240,255,.4)}
  #info h1 span{color:var(--cy)}
  #info .ep{font-size:12px;color:rgba(220,250,255,.75);margin-top:2px}
  .stat{display:grid;grid-template-columns:42px 1fr 52px;gap:8px;align-items:center;font-size:12px;margin-top:7px}
  .stat .l{font-family:var(--en);font-weight:700;letter-spacing:.12em;color:var(--cy)}
  .stat .b{height:6px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
  .stat .b i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--cy2),var(--cy));box-shadow:0 0 8px var(--cy);transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .stat .v{font-family:var(--en);font-weight:700;font-size:15px;text-align:right}
  .skill .lab{display:flex;align-items:center;gap:8px;font-size:11px}
  .skill .lab b{font-family:var(--en);letter-spacing:.2em;background:var(--mg);color:#fff;padding:1px 8px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
  .skill h3{font-size:20px;font-weight:900;margin-top:6px;letter-spacing:.08em}
  .skill h3 small{font-family:var(--en);font-size:11px;letter-spacing:.3em;color:var(--cy);margin-left:8px}
  .skill p{font-size:12px;line-height:1.7;color:rgba(220,250,255,.8);margin-top:4px}
  #decide{position:relative;height:84px;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden;
    background:linear-gradient(120deg,rgba(26,168,255,.95),rgba(63,240,255,.95));color:#021220;
    clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px)}
  #decide::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.14) 14px 18px);animation:slide 1.6s linear infinite}
  @keyframes slide{to{background-position:44px 0}}
  #decide::after{content:"";position:absolute;top:0;left:-50%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 2.6s infinite}
  @keyframes shine{0%,60%{left:-50%}100%{left:130%}}
  #decide b{font-size:36px;font-weight:900;letter-spacing:.4em;position:relative;z-index:1;padding-left:.4em}
  #decide small{font-family:var(--en);font-weight:700;font-size:12px;letter-spacing:.4em;position:relative;z-index:1}
  #toLobby{height:40px;justify-content:center;display:none;align-items:center;font-size:13px;font-weight:700;letter-spacing:.1em}
  #toLobby.show{display:flex}

  /* 下：キャラ一覧 */
  #roster{position:fixed;left:24px;right:24px;bottom:18px;display:flex;gap:10px;align-items:flex-end;padding:12px 14px 12px 14px}
  #roster .cap{position:absolute;left:16px;top:-22px;font-family:var(--en);font-size:12px;letter-spacing:.3em;color:var(--cy)}
  .ic{position:relative;width:92px;height:108px;flex:none;cursor:pointer;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    background:linear-gradient(160deg,#1c2b56,#0b1124);box-shadow:inset 0 0 0 1px rgba(63,240,255,.3);transition:transform .15s, box-shadow .15s}
  .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ic .nm{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:11px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center}
  .ic .st{position:absolute;left:6px;top:4px;font-size:9px;color:var(--yl);letter-spacing:1px;text-shadow:0 0 4px #000}
  .ic .e{position:absolute;right:5px;top:4px;font-size:12px}
  .ic:hover{transform:translateY(-4px)}
  .ic.sel{transform:translateY(-10px);box-shadow:inset 0 0 0 2px var(--cy),0 0 0 0 transparent}
  .ic.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 22px rgba(63,240,255,.7)}
  .ic.lock{cursor:not-allowed}
  .ic.lock .sil{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:rgba(120,150,220,.25)}
  .ic.lock .nm{color:rgba(200,220,255,.45)}
  .ic.lock .lk{position:absolute;right:6px;bottom:22px;font-size:12px;opacity:.6}
  .ic.ur{background:linear-gradient(160deg,#3a7bd5,#0b2a5a)}

  #prompt{position:fixed;left:38%;top:46%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .4s}
  #prompt b{display:block;font-family:var(--en);font-size:34px;letter-spacing:.5em;color:var(--cy);text-shadow:0 0 18px var(--cy);padding-left:.5em}
  #prompt span{font-size:13px;color:rgba(220,250,255,.7);letter-spacing:.2em}
  #prompt.hide{opacity:0}

  /* セリフ字幕 */
  #sub{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);padding:10px 22px;font-size:17px;font-weight:700;letter-spacing:.06em;background:rgba(4,10,24,.72);border-left:3px solid var(--cy);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:6}
  #sub.show{opacity:1}
  body.skill #sub{bottom:16%}

  /* ---------- 技演出 ---------- */
  .lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:5;transition:height .35s cubic-bezier(.2,.8,.2,1)}
  #lbT{top:0} #lbB{bottom:0}
  body.skill .lb{height:9vh}
  #flash{position:fixed;inset:0;background:radial-gradient(circle at 45% 45%,#fff,#bff6ff 40%,rgba(63,240,255,.6));opacity:0;pointer-events:none;z-index:7}
  #cutin{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
  #cutin.on{opacity:1}
  #cutin .band{position:absolute;left:-10%;right:-10%;top:30%;height:40%;transform:skewY(-8deg) translateX(-110%);
    background:linear-gradient(90deg,rgba(2,20,40,.95),rgba(10,60,110,.95) 45%,rgba(63,240,255,.9) 100%);overflow:hidden;
    box-shadow:0 0 0 3px var(--cy),0 0 40px rgba(63,240,255,.7)}
  #cutin.on .band{animation:band 1.15s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes band{0%{transform:skewY(-8deg) translateX(-110%)}22%{transform:skewY(-8deg) translateX(0)}80%{transform:skewY(-8deg) translateX(3%)}100%{transform:skewY(-8deg) translateX(110%)}}
  #cutin .band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 40px,rgba(255,255,255,.08) 40px 44px);animation:speed .25s linear infinite}
  @keyframes speed{to{background-position:-88px 0}}
  #cutin img{position:absolute;left:10%;top:-30%;height:160%;transform:skewY(8deg);filter:drop-shadow(0 0 20px rgba(63,240,255,.8));-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
  #cutin .txt{position:absolute;left:46%;top:50%;transform:translateY(-50%) skewY(8deg)}
  #cutin .txt small{display:block;font-family:var(--en);font-weight:700;font-size:18px;letter-spacing:.6em;color:var(--yl)}
  #cutin .txt b{display:block;font-size:min(9vw,96px);font-weight:900;letter-spacing:.06em;line-height:1.05;color:#fff;text-shadow:0 0 24px var(--cy),4px 4px 0 rgba(0,40,80,.8)}
  #cutin .txt span{display:block;font-family:var(--en);font-weight:700;font-size:22px;letter-spacing:.5em;color:var(--ice)}

  #toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);padding:14px 30px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
  #toast.show{opacity:1}

  #loading{position:fixed;inset:0;z-index:10;background:#03050d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
  #loading.hide{opacity:0;pointer-events:none}
  #loading .t{font-family:var(--en);font-weight:700;font-size:30px;letter-spacing:.5em;color:var(--cy);text-shadow:0 0 18px var(--cy);padding-left:.5em}
  #loading .bar{width:300px;height:3px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
  #loading .bar i{position:absolute;inset:0 auto 0 0;background:var(--cy);box-shadow:0 0 8px var(--cy)}
  #loading .m{font-family:var(--en);font-size:12px;letter-spacing:.3em;color:rgba(200,250,255,.6)}

  /* カレン選択中は桃色・紫の配色 */
  body.karen{--cy:#ff6ad8;--cy2:#b04cff;--line:rgba(255,106,216,.45)}
  body.karen #decide{background:linear-gradient(120deg,rgba(176,76,255,.95),rgba(255,106,216,.95));color:#1c0220}
  body.karen #info h1{text-shadow:0 0 18px rgba(255,106,216,.45);font-size:31px}
  .ic.ka{background:linear-gradient(160deg,#c2409a,#2a0b3a)}
  .ic.wait .ld{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:.1em;color:#ffb8ec}
  #mute{height:40px;padding:0 14px;font-family:var(--en);font-weight:700;letter-spacing:.14em;font-size:13px;display:none}
  body.karen #mute{display:block}
  @media (max-aspect-ratio:1/1){
    #info{left:12px;right:12px;width:auto;top:auto;bottom:150px;transform:none;gap:6px}
    #info.hidden{transform:translateY(20px)}
    #info .card:not(.main){display:none}
    #info h1{font-size:26px}
    body.karen #info h1{font-size:23px}
    .stat{display:none}
    #decide{height:64px}
    #roster{left:8px;right:8px;bottom:8px;overflow-x:auto;gap:8px}
    .ic{width:70px;height:84px}
    #prompt{left:50%;top:36%}
    #head{left:12px;top:12px}
    #title b{font-size:18px}
    #sub{white-space:normal;width:90%;bottom:auto;top:84px;font-size:14px}
  }

  /* スマホ横持ち（高さが低い画面）ではUI全体を縮小 */
  @media (max-height:520px) and (min-aspect-ratio:1/1){ #ui{zoom:.58} #sub{zoom:.75;bottom:120px} #cutin .txt{zoom:.7} #toast{zoom:.8} }
</style>

<script>
/* タップ補助（iPad・スマホ）：指を離した瞬間に、その場所へクリックを送る */
(() => {
  let st = null, lastUp = -1e9;
  const FORM = 'input,textarea,select,label,option,[contenteditable]';
  addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && e.isPrimary) st = { x: e.clientX, y: e.clientY, t: performance.now(), el: e.target }; }, true);
  addEventListener('pointercancel', e => { if (e.pointerType === 'touch') st = null; }, true);
  addEventListener('pointerup', e => {
    if (e.pointerType !== 'touch' || !e.isPrimary || !st) return;
    const s = st; st = null;
    if (s.el.closest && s.el.closest(FORM)) return;                       // 入力欄はブラウザに任せる
    lastUp = performance.now();
    if (Math.hypot(e.clientX - s.x, e.clientY - s.y) > 24 || lastUp - s.t > 900) return;   // ドラッグや長押しはタップにしない
    s.el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window, clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY }));
  }, true);
  addEventListener('click', e => {
    if (e.isTrusted && performance.now() - lastUp < 800 && !(e.target.closest && e.target.closest(FORM))) { e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp01(x), 3);

/* =====================================================================
   レンダラー
   ===================================================================== */
const MOBILE = matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);   // スマホは描画を軽く
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.25 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05081a);
scene.fog = new THREE.FogExp2(0x04061a, 0.035);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
camera.setFocalLength(70);

const _db = renderer.getDrawingBufferSize(new THREE.Vector2());
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(_db.x, _db.y, { samples: 4, type: THREE.HalfFloatType }));   // MSAAで輪郭をなめらかに
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.45, 1.05);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const softTex = canvasTex(64, 64, g => {
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
});
const glow = (r, g, b) => new THREE.Color(r, g, b);

/* =====================================================================
   ステージ（鏡面の床・氷晶・ホログラム・光の筋・光輪のゲート）
   ===================================================================== */
const env = new THREE.Group(); scene.add(env);
const envTick = [];      // 毎フレーム呼ぶアニメーション
{
  // 金属の質感用に、控えめな環境マップ
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
  scene.environmentIntensity = .35;

  // ---- 空（星雲のような夜空） ----
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { time: { value: 0 } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,

  } else if (kFin) {                                        // 決定：三回転して決めポーズ
    const f = kFin; f.t += rdt;
    const k = Math.min(1, f.t / 1.5);
    x = kRoot.position.x * (1 - k * .2);
    if (f.t < 1.5) { P = kBlend(KP.open, KP.passe, Math.min(1, f.t / .25)); yaw = kss(k) * Math.PI * 6; }
    else P = kBlend(KP.passe, KP.finale, Math.min(1, (f.t - 1.5) / .15));
    SPOTS.forEach(s => s.want = 1);
    if (f.stage === 0 && f.t > 1.5) {
      f.stage = 1; popConfetti(); fwBurst(L(-.5, 2.9, -1.0), { n: 400, speed: 3.4, cols: FW_COLS.party, life: 1.8, light: 8 }); SFX.boom(1.2); flash(.6, .5); shake = .6; burstShock(4, .7);
      kSmile(1, true); say('フィナーレは、あなたと一緒に。よろしくね♪', 2.4);
      const ac = SND.ac; if (ac) { const t0 = ac.currentTime; DR.crash(t0); DR.kick(t0); DR.stab(t0, [57, 61, 64, 69]); DR.stab(t0 + .25, [57, 61, 64, 69, 73]); DR.lead(t0 + .25, 81, .9, 76); }
    }
    if (f.t > 3.6) {
      kFin = null; document.body.classList.remove('skill');
      document.getElementById('toLobby').classList.add('show');
      toast('カレン・カデンツァ をパートナーに決定しました');
      try { localStorage.setItem('partner', 'karen'); } catch (e) {}
    }
  } else if (kClock > -50) {                                // 音符で遊ぶ
    perfD = kShowLoop(beat, rdt, t); P = perfD.pose; yaw = YAW0; perf = true;
  } else P = KP.back;
  // 拍ごとに小さく沈む・頭でリズム
  const bounce = kShow || kFin || perf ? 0 : -.025 * Math.pow(Math.abs(Math.cos(Math.PI * beat)), 6);
  const PP = { ...P, _y: [(P._y ? P._y[0] : 0) + bounce, 0, 0], head: [P.head[0] + (kShow || kFin ? 0 : Math.sin(Math.PI * 2 * beat) * .04), P.head[1], P.head[2]] };
  if (perf) { kRoot.position.set(x, y, z); kRoot.rotation.y = yaw; }
  else { kRoot.position.x += (x - kRoot.position.x) * (kShow ? 1 : 1 - Math.exp(-rdt * 14)); kRoot.position.y *= .8; kRoot.position.z *= .8; kRoot.rotation.y = yaw + (kShow ? 0 : .22); }
  kSm = kSm ? kBlend(kSm, PP, 1 - Math.exp(-rdt * 14)) : PP;     // ポーズの切り替わりをなめらかに
  kApply(kSm);
  // 指の形と、目標へ向ける腕
  const hd = perfD ? perfD.hands : { right: [.15, .2, .15], left: [.15, .2, .15] };
  kHand('right', ...hd.right); kHand('left', ...hd.left);
  if (perfD) for (const [side, goal, w] of perfD.aims) kAim(side, goal, w);
  kHipW += ((perfD?.hipL || 0) - kHipW) * (1 - Math.exp(-rdt * 8)); kHipHand(kHipW);
  // 花火のときはカメラを少し上へ・広く
  const camT = perfD ? perfD.cam : kFin ? .7 : 0;
  camWide += (camT * .4 - camWide) * (1 - Math.exp(-rdt * 2.5)); focus.y += (camT * .75 - focus.y) * (1 - Math.exp(-rdt * 2.5));
  focus.x += (kRoot.position.x * (camera.aspect < 1 ? .85 : .55) - focus.x) * (1 - Math.exp(-rdt * 3));
  focus.z += (kRoot.position.z * .5 - focus.z) * (1 - Math.exp(-rdt * 3));
  // スポット：メインはカレンを追う。色つきは拍に合わせて舞台を掃き、4拍目でカレンに集まる
  main.aim.set(kRoot.position.x, 0, 0);
  cols.forEach((c, i) => {
    const ph = beat * Math.PI / 2 + i * 2.1, gather = kFin || Math.floor(beat) % 4 === 3 ? 1 : 0;
    c.g = (c.g ?? 0) + (gather - (c.g ?? 0)) * (1 - Math.exp(-rdt * 8));
    c.aim.set(kLerp(Math.sin(ph) * 2.6, kRoot.position.x, c.g), 0, kLerp(Math.cos(ph * .7) * 1.6 - .4, 0, c.g));
  });
  updateSpots(t);
  updatePerfFx(rdt);
  // 紙吹雪
  if (confetti.visible) {
    for (let i = 0; i < CF; i++) { const v = cfV[i]; v.y -= 4 * rdt; v.multiplyScalar(1 - rdt * 1.8); cfPos[i * 3] += v.x * rdt + Math.sin(t * 6 + i) * .004; cfPos[i * 3 + 1] = Math.max(.13, cfPos[i * 3 + 1] + v.y * rdt); cfPos[i * 3 + 2] += v.z * rdt; }
    confetti.geometry.attributes.position.needsUpdate = true;
    confetti.material.opacity -= rdt * .18; if (confetti.material.opacity <= 0) confetti.visible = false;
  }
  karen.humanoid.getRawBoneNode('head').getWorldPosition(headPos);
  (karen.humanoid.getRawBoneNode('upperChest') || karen.humanoid.getRawBoneNode('chest')).getWorldPosition(chestPos);
  updateCamera(t, rdt);
  updateFace(rdt, karen);
  karen.update(rdt);
}

/* ---------- 右パネルの中身 ---------- */
const CHARS = {
  shino: { rar: 'UR', stars: 5, el: '❄', role: '氷属性 ／ アタッカー', name: '雪代 <span>しの</span>', ep: '凍晶のオペレーター ── SHINO YUKISHIRO',
    stats: [['HP', 72, '8,640'], ['ATK', 94, '3,912'], ['DEF', 58, '1,705'], ['SPD', 81, '142']],
    skill: '氷華・零式', skillEn: 'HYOKA ZERO', skillTxt: '足元から氷晶の華を咲かせ、周囲の敵すべてに氷属性の大ダメージ。3ターンのあいだ敵の行動速度を下げる。' },
  karen: { rar: 'UR', stars: 5, el: '♪', role: '音属性 ／ ダンサー', name: 'カレン・<span>カデンツァ</span>', ep: 'ステップで舞う踊り子 ── KAREN CADENZA',
    stats: [['HP', 64, '7,920'], ['ATK', 78, '3,240'], ['DEF', 50, '1,480'], ['SPD', 98, '171']],
    skill: '終幕舞踏・カデンツァ', skillEn: 'FINAL CADENZA', skillTxt: '華麗なステップで舞台を支配し、スポットライトの当たった敵すべてに音属性の連続ダメージ。2ターンのあいだ味方全体の行動速度を上げる。' },
};
function setInfo(id) {
  const c = CHARS[id];
  info.querySelector('.card.main').innerHTML = `<div class="rar"><b>${c.rar}</b><span>${'★'.repeat(c.stars)}</span><div class="el"><i>${c.el}</i>${c.role}</div></div><h1>${c.name}</h1><div class="ep">${c.ep}</div>`
    + c.stats.map(([l, w, v]) => `<div class="stat"><span class="l">${l}</span><span class="b"><i data-w="${w}"></i></span><span class="v">${v}</span></div>`).join('');
  info.querySelector('.card.skill').innerHTML = `<div class="lab"><b>SKILL</b>必殺技</div><h3>${c.skill}<small>${c.skillEn}</small></h3><p>${c.skillTxt}</p>`;
}

/* =====================================================================
   その他UI
   ===================================================================== */
const toastEl = document.getElementById('toast'); let toastT;
function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1700); }
document.getElementById('back').addEventListener('click', () => location.href = 'lobby.html?v=20261127215119');
document.getElementById('toLobby').addEventListener('click', () => location.href = 'lobby.html?v=20261127215119');
window.__sel = { karen: () => ({ karen, kRoot, kShow, kFin, kClock, SPOTS, M, select: () => selectKaren(ROSTER.find(r => r.id === 'karen').card), decide: karenDecide, KP, kApply, clock: v => { musicStop(); kClock = v; }, icon: karenIcon }), pose: n => setPose(n, 10), shot: setShot, select: () => selectShino(document.querySelector('.ic.ur')), step: (sec) => { for (let i = 0; i < sec * 60; i++) tick(1 / 60); }, state: () => ({ skill, conv: conv.visible, glow: handGlow.scale.x, shot }), POSES, bone: n => bone(n), THREE, ear: EAR_OFFSET, hint: ELBOW_HINT, dbg: () => { const f = n => bone(n).getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)); const t = EAR_OFFSET.clone(); bone('head').localToWorld(t); return { head: f('head'), hand: f('leftHand'), elbow: f('leftLowerArm'), sh: f('leftUpperArm'), target: t.toArray().map(v => +v.toFixed(3)), rawHand: vrm.humanoid.getRawBoneNode('leftHand').getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)) }; }, show: () => { vrm.scene.visible = true; document.getElementById('loading').classList.add('hide'); setShot('normal'); } };

/* =====================================================================
   ループ
   ===================================================================== */
const clock = new THREE.Clock();
let simT = 0;
function loop() {
  requestAnimationFrame(loop);
  tick(Math.min(clock.getDelta(), .05));
}
let wallT = 0;
function tick(rdt) {
  wallT += rdt;
  const dt = rdt * timeScale; simT += dt;
  const t = wallT;
  mouseS.lerp(mouse, 1 - Math.exp(-rdt * 3));

  if (vrm) {
    if (vrm.scene.visible) {
      vrm.humanoid.getRawBoneNode('head').getWorldPosition(headPos);
      vrm.humanoid.getRawBoneNode('upperChest')?.getWorldPosition(chestPos) ?? vrm.humanoid.getRawBoneNode('chest').getWorldPosition(chestPos);
      updateCamera(simT, rdt);
      updateAppear(dt);
      updateSkill(rdt);
      updatePose(dt, simT);
      updatePalmFlake(dt, simT, poseName === 'kime' && !skill);
      updateFace(dt);
      vrm.update(dt);
    } else if (active === 'karen' && karen) karenTick(dt, rdt, simT);
    else {
      if (shot !== 'normal') setShot('normal');
      updateCamera(simT, rdt);
    }
  }
  updateTheme(rdt);
  // 衝撃波
  if (shock.visible) { const u = shock.userData; u.t += dt; const k = u.t / u.life; shock.scale.setScalar(.2 + ease(k) * u.size); shock.material.opacity = 1 - k; if (k >= 1) shock.visible = false; }
  if (shock2.visible) { const u = shock2.userData; u.t += dt; const k = u.t / .6; shock2.position.copy(handPos); shock2.lookAt(camera.position); shock2.scale.setScalar(.1 + ease(k) * 2.2); shock2.material.opacity = 1 - k; if (k >= 1) shock2.visible = false; }
  // 演出系
  if (!skill) magic.rotation.z += rdt * .25;
  env.userData.tick(t, rdt);
  deco.forEach(c => { c.position.y = c.userData.y + Math.sin(t + c.userData.s) * .08; c.rotation.y = t * .5 + c.userData.s; });
  const sp = snowGeo.attributes.position.array, storm = skill?.stage === 2 ? 4 : 1;
  for (let i = 0; i < SNOW; i++) { sp[i * 3 + 1] -= snowV[i] * rdt * storm; sp[i * 3] += Math.sin(t + i) * .002 * storm; if (sp[i * 3 + 1] < 0) sp[i * 3 + 1] = 7; }
  snowGeo.attributes.position.needsUpdate = true;
  composer.render(rdt);
}
loop();

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
