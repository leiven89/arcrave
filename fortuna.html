<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>フォルトゥナ・レイズ PV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho+B1:wght@700;800&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  /* カジノ《ルーチェ・ドーロ》とフォルトゥナ・レイズの登場PV（ゲーム本編と同じ暗い配色で固定） */
  :root{ --gold:#ffd77a; --gold2:#c99a3b; --ink:#f6efe2; --mute:#b9a98f; --wine:#2a0710; --violet:#9b6bff;
    --en:"Rajdhani",sans-serif; --jp:"Zen Kaku Gothic New",sans-serif; --min:"Shippori Mincho B1",serif; --pop:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
    color-scheme:dark; }
  html,body{margin:0;height:100%;background:#07040a;color:var(--ink);font-family:var(--jp);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .layer{position:fixed;inset:0;pointer-events:none}
  #bars::before,#bars::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .8s ease}
  #bars::before{top:0} #bars::after{bottom:0}
  body.pv #bars::before,body.pv #bars::after{height:min(9vh,9vw)}
  #fade{background:#000;opacity:1;transition:opacity .6s}
  #flash{background:#fff;opacity:0}
  /* 読み込み・開始 */
  #gate{display:grid;place-items:center;pointer-events:auto;background:radial-gradient(ellipse at 50% 60%,#3a0c18 0%,#0b0508 70%);transition:opacity .6s}
  #gate.hide{opacity:0;pointer-events:none}
  .gbox{text-align:center;padding:0 16px}
  .gbox small{font:700 13px var(--en);letter-spacing:.5em;color:var(--gold);padding-left:.5em}
  .gbox h1{margin:.3em 0 .2em;font:800 clamp(30px,7vw,60px)/1.15 var(--min);letter-spacing:.08em;background:linear-gradient(180deg,#fff6da,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .gbox p{margin:0 0 22px;color:var(--mute);font-size:13px}
  #bar{width:min(320px,70vw);height:3px;margin:0 auto 22px;background:rgba(255,215,122,.18)}
  #bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  .btn{font:700 15px var(--jp);letter-spacing:.12em;color:#1a0d02;background:linear-gradient(120deg,#fff1c4,var(--gold) 50%,#e0a948);border:0;padding:14px 30px;cursor:pointer;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
  .btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  /* 画面上のボタン */
  #hud{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto;z-index:5}
  #hud button,#hud a{font:700 12px var(--jp);color:var(--ink);background:rgba(20,8,14,.6);border:1px solid rgba(255,215,122,.4);border-radius:4px;padding:8px 12px;cursor:pointer;text-decoration:none;backdrop-filter:blur(4px)}
  #hud button:hover,#hud a:hover{border-color:var(--gold)}
  #hud [hidden]{display:none}
  #endmenu{position:fixed;left:50%;bottom:calc(min(9vh,9vw) + 18px);transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto;opacity:0;transition:opacity .6s;z-index:5}
  #endmenu.on{opacity:1} #endmenu:not(.on){pointer-events:none}
  #endmenu .btn.sub{background:rgba(20,8,14,.7);color:var(--ink);border:1px solid rgba(255,215,122,.5)}
  /* セリフ */
  #cap{position:fixed;left:0;right:0;bottom:calc(min(9vh,9vw) + 14px);text-align:center;font:700 clamp(15px,3.4vw,22px)/1.5 var(--min);letter-spacing:.1em;color:#fff;text-shadow:0 2px 8px #000,0 0 18px rgba(0,0,0,.8);opacity:0;transition:opacity .35s;padding:0 16px}
  #cap.on{opacity:1}
  /* くるっ（擬音） */
  .ono{position:absolute;font:400 clamp(28px,6.5vw,58px)/1 var(--pop);color:#fff4c9;-webkit-text-stroke:2px #6a2a00;paint-order:stroke fill;text-shadow:0 0 14px rgba(255,200,90,.9),0 4px 0 #3a1200;white-space:nowrap;transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:0;animation:ono .75s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes ono{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(var(--r,-14deg))}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(var(--r,-14deg))}70%{opacity:1;transform:translate(-50%,-60%) scale(1) rotate(var(--r,-14deg))}100%{opacity:0;transform:translate(-50%,-80%) scale(.9) rotate(var(--r,-14deg))}}
  /* 名前のロゴ */
  #logo{position:fixed;left:max(6vw,16px);bottom:calc(min(9vh,9vw) + 7vh);max-width:min(560px,60vw);opacity:0;transform:translateX(-30px);transition:opacity 1s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
  #logo.on{opacity:1;transform:none}
  #logo .tag{font:700 clamp(10px,1.8vw,14px) var(--en);letter-spacing:.5em;color:var(--violet);text-shadow:0 0 10px rgba(155,107,255,.8)}
  #logo h2{margin:.15em 0 0;font:800 clamp(30px,7.2vw,76px)/1.05 var(--min);letter-spacing:.06em;background:linear-gradient(180deg,#fffbe8 10%,var(--gold) 55%,#b07a25);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,190,90,.55)) drop-shadow(0 3px 0 rgba(0,0,0,.6))}
  #logo .en{font:700 clamp(13px,2.6vw,22px) var(--en);letter-spacing:.55em;color:var(--ink);margin-top:.3em}
  #logo .line{height:1px;margin:.8em 0;background:linear-gradient(90deg,var(--gold),transparent)}
  #logo .copy{font:700 clamp(13px,2.4vw,18px)/1.6 var(--min);letter-spacing:.16em;color:#fff}
  #place{position:fixed;left:max(6vw,16px);top:calc(min(9vh,9vw) + 5vh);opacity:0;transition:opacity 1s}
  #place.on{opacity:1}
  #place small{display:block;font:700 12px var(--en);letter-spacing:.5em;color:var(--gold)}
  #place b{font:800 clamp(20px,4.4vw,36px) var(--min);letter-spacing:.14em;text-shadow:0 2px 10px #000}
  /* 歩くモード */
  #help{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:var(--mute);background:rgba(10,4,8,.6);padding:6px 12px;border-radius:4px;opacity:0;transition:opacity .5s;white-space:nowrap}
  body.walk #help{opacity:1}
  #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,215,122,.35);background:rgba(20,8,14,.25);display:none}
  #joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,215,122,.55)}
  @media (prefers-reduced-motion:reduce){.ono{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bars" class="layer"></div>
<div id="ono" class="layer"></div>
<div id="place"><small>CASINO</small><b>ルーチェ・ドーロ</b></div>

</div>
<div id="gate" class="layer">
  <div class="gbox">
    <small>ARC RAVE // NEW CHARACTER</small>
    <h1>フォルトゥナ・レイズ</h1>
    <p id="gmsg">キャラクターを読み込んでいます…</p>
    <div id="bar"><i></i></div>
    <button class="btn" id="go" type="button" disabled>▶ PVを再生</button>
  </div>
</div>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const SNAP_T = Q.has('t') ? Number(Q.get('t')) : null;     // ?t=8.5 … その時刻の1コマだけ描く（確認用）
const SNAP_WALK = Q.get('mode') === 'walk';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // 毎回同じ並びの乱数

/* =====================================================================
   描画の準備
   ===================================================================== */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: SNAP_T !== null || SNAP_WALK });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0408);
scene.fog = new THREE.Fog(0x12060b, 14, 46);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 120);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.6, 0.5, 0.93);
composer.addPass(bloom); composer.addPass(new OutputPass());
function resize() {
  const w = Number(Q.get('w')) || innerWidth || 1280, h = Number(Q.get('h')) || innerHeight || 720;   // ?w=&h= は確認用
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function tex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
const std = (o) => new THREE.MeshStandardMaterial(o);
const GOLD = std({ color: 0xd9a64a, metalness: .9, roughness: .3, emissive: 0x3a2508, emissiveIntensity: .6 });
const BLACK = std({ color: 0x0d0a10, metalness: .5, roughness: .25 });

/* =====================================================================
   カジノ《ルーチェ・ドーロ》
   ===================================================================== */
const DAIS_Y = 0.3, DAIS_R = 2.4;
const ROOM = { x: 21, z0: -15, z1: 17 };
const colliders = [];          // 歩くときにぶつかる丸 [x, z, r]
const spinners = [];           // 回り続けるもの
const blinkers = [];           // 点滅するランプ

// 床：赤いじゅうたんに金の菱形模様
const carpet = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#4a0c16'; g.fillRect(0, 0, w, h);
  const gr = g.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w * .7); gr.addColorStop(0, 'rgba(120,20,40,.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#b8862f'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(w / 2, 6); g.lineTo(w - 6, h / 2); g.lineTo(w / 2, h - 6); g.lineTo(6, h / 2); g.closePath(); g.stroke();
  g.lineWidth = 1.5; g.strokeStyle = '#8a5f1e';
  g.beginPath(); g.moveTo(w / 2, 34); g.lineTo(w - 34, h / 2); g.lineTo(w / 2, h - 34); g.lineTo(34, h / 2); g.closePath(); g.stroke();
  g.fillStyle = '#d8a54a';
  for (const [x, y] of [[w / 2, h / 2], [0, 0], [w, 0], [0, h], [w, h]]) { g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); }
  g.font = 'bold 34px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#9c6b22'; g.fillText('♦', w / 2, h / 2 + 1);
}, [14, 10]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x * 2 + 2, ROOM.z1 - ROOM.z0 + 2), std({ map: carpet, roughness: .9 }));
floor.rotation.x = -Math.PI / 2; floor.position.z = (ROOM.z0 + ROOM.z1) / 2; floor.receiveShadow = true; scene.add(floor);
// 中央の黒い大理石と金の円
const marble = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#0c090f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(160,140,170,${.04 + rnd() * .06})`; g.lineWidth = rnd() * 2; g.beginPath(); let x = rnd() * w, y = rnd() * h; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (rnd() - .5) * 120; y += (rnd() - .5) * 120; g.lineTo(x, y); } g.stroke(); }
  g.strokeStyle = '#d6a64c'; g.lineWidth = 6; g.beginPath(); g.arc(w / 2, h / 2, w * .48, 0, 7); g.stroke();
  g.lineWidth = 2; g.beginPath(); g.arc(w / 2, h / 2, w * .44, 0, 7); g.stroke();
  g.save(); g.translate(w / 2, h / 2);
  for (let i = 0; i < 16; i++) { g.rotate(Math.PI / 8); g.beginPath(); g.moveTo(w * .25, 0); g.lineTo(w * .43, -10); g.lineTo(w * .44, 0); g.lineTo(w * .43, 10); g.closePath(); g.fillStyle = i % 2 ? '#a8792c' : '#e2b75e'; g.fill(); }
  g.restore();
});
const ring = new THREE.Mesh(new THREE.CircleGeometry(6.5, 64), std({ map: marble, roughness: .25, metalness: .3 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = .006; ring.receiveShadow = true; scene.add(ring);
// 舞台（フォルトゥナが立つ丸い台）
{
  const top = tex(512, 512, (g, w, h) => {
    g.fillStyle = '#100a14'; g.fillRect(0, 0, w, h);
    g.translate(w / 2, h / 2);
    const cols = ['#5b0f1e', '#0d0a10'];
    for (let i = 0; i < 37; i++) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, w * .47, i / 37 * Math.PI * 2, (i + 1) / 37 * Math.PI * 2); g.closePath(); g.fillStyle = i === 0 ? '#0d4a2a' : cols[i % 2]; g.fill(); }
    g.fillStyle = '#100a14'; g.beginPath(); g.arc(0, 0, w * .36, 0, 7); g.fill();
    g.strokeStyle = '#d6a64c'; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, w * .36, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, w * .475, 0, 7); g.stroke();
    g.font = '800 64px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#e8bd62'; g.fillText('F', 0, 4);
    g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 52, 0, 7); g.stroke();
  });
  const d = new THREE.Mesh(new THREE.CylinderGeometry(DAIS_R, DAIS_R + .15, DAIS_Y, 64), [std({ color: 0x1a0d12, metalness: .6, roughness: .35 }), std({ map: top, roughness: .3, metalness: .2 }), BLACK]);
  d.position.y = DAIS_Y / 2; d.receiveShadow = true; d.castShadow = true; scene.add(d);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(DAIS_R + .02, .035, 8, 96), GOLD); rim.rotation.x = Math.PI / 2; rim.position.y = DAIS_Y; scene.add(rim);
  // 台のふちの小さなランプ
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2, m = new THREE.Mesh(new THREE.SphereGeometry(.035, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffd98a }));
    m.position.set(Math.sin(a) * (DAIS_R + .09), DAIS_Y * .5, Math.cos(a) * (DAIS_R + .09)); scene.add(m); blinkers.push({ m, ph: i * .5, kind: 'chase' });
  }
}
// 正面から舞台へ続く赤い通路
{
  const run = tex(64, 256, (g, w, h) => { g.fillStyle = '#7a0f20'; g.fillRect(0, 0, w, h); g.fillStyle = '#d6a64c'; g.fillRect(3, 0, 4, h); g.fillRect(w - 7, 0, 4, h); }, [1, 4]);
  const r = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 14), std({ map: run, roughness: .85 }));
  r.rotation.x = -Math.PI / 2; r.position.set(0, .012, 9.2); r.receiveShadow = true; scene.add(r);
  for (const sx of [-1.6, 1.6]) for (let z = 4; z <= 15; z += 2.75) {         // 赤いロープの柱
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.05, .09, 1, 12), GOLD); p.position.set(sx, .5, z); scene.add(p);
    const b = new THREE.Mesh(new THREE.SphereGeometry(.08, 12, 8), GOLD); b.position.set(sx, 1.03, z); scene.add(b);
    if (z + 2.75 <= 15.1) {
      const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(sx, .92, z), new THREE.Vector3(sx, .6, z + 1.37), new THREE.Vector3(sx, .92, z + 2.75));
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, .025, 6), std({ color: 0x8a1022, roughness: .6 })));
    }
  }
}
// 壁：ワインレッドの壁板と金の枠
const wallTex = tex(256, 512, (g, w, h) => {
  g.fillStyle = '#2a0710'; g.fillRect(0, 0, w, h);
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(0,0,0,.5)'); gr.addColorStop(.6, 'rgba(90,15,30,.25)'); gr.addColorStop(1, 'rgba(0,0,0,.4)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#a67a2c'; g.lineWidth = 4; g.strokeRect(22, 40, w - 44, h * .55);
  g.lineWidth = 2; g.strokeRect(34, 52, w - 68, h * .55 - 24); g.strokeRect(22, h * .68, w - 44, h * .26);
  g.fillStyle = '#c4923e'; g.fillRect(0, h * .63, w, 6);
  g.font = 'bold 40px serif'; g.textAlign = 'center'; g.fillStyle = 'rgba(200,150,70,.35)'; g.fillText('♠', w / 2, h * .33);
}, [16, 1]);
{
  const H = 10, W = ROOM.x * 2, D = ROOM.z1 - ROOM.z0;
  const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H), std({ map: wallTex, roughness: .8 })); back.position.set(0, H / 2, ROOM.z0); scene.add(back);
  const t2 = wallTex.clone(); t2.repeat.set(12, 1); t2.needsUpdate = true;
  for (const s of [-1, 1]) { const m = new THREE.Mesh(new THREE.PlaneGeometry(D, H), std({ map: t2, roughness: .8 })); m.position.set(s * ROOM.x, H / 2, (ROOM.z0 + ROOM.z1) / 2); m.rotation.y = -s * Math.PI / 2; scene.add(m); }
  const front = new THREE.Mesh(new THREE.PlaneGeometry(W, H), std({ map: wallTex, roughness: .8 })); front.position.set(0, H / 2, ROOM.z1); front.rotation.y = Math.PI; scene.add(front);
  const ceilTex = tex(256, 256, (g, w, h) => { g.fillStyle = '#12070b'; g.fillRect(0, 0, w, h); g.strokeStyle = '#5a3c16'; g.lineWidth = 6; g.strokeRect(8, 8, w - 16, h - 16); g.strokeStyle = '#2e1b0a'; g.lineWidth = 3; g.strokeRect(34, 34, w - 68, h - 68); }, [10, 8]);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), std({ map: ceilTex, roughness: .9 })); ceil.rotation.x = Math.PI / 2; ceil.position.set(0, H, (ROOM.z0 + ROOM.z1) / 2); scene.add(ceil);
  // 金の柱

// 確認用：その時刻まで決まった刻みで進めて1コマ描く

  resetPV(); mode = 'pv'; document.body.className = 'pv'; $('gate').classList.add('hide'); $('fade').style.opacity = 0;
  $('gate').style.display = 'none'; $('fade').style.display = 'none';
  const n = Math.round(t * 60); for (let i = 0; i < n; i++) update(1 / 60);
  render(); window.__ready = true; document.title = 'READY ' + t;
}
window.__snap = snapshot;
window.__step = n => { for (let i = 0; i < n; i++) update(1 / 60); render(); };   // 確認用
if (SNAP_T === null && !SNAP_WALK) requestAnimationFrame(loop);
</script>
</body>
